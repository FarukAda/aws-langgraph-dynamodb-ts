name: Mutation testing

# CI-ONLY. Stryker pegs the CPU and is forbidden on developer machines (blocked
# by a local hook + deny rules). It runs here on a schedule and on demand, never
# on every PR, gated on the mutation score in stryker.conf.json. Stryker is
# installed on the runner only (intentionally NOT a devDependency) so it cannot
# be invoked locally by accident.

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch: {}

# Least privilege for every job: nothing here writes to the repository, creates
# a release or requests an OIDC token, so the default token scope is wider than
# any job needs. Jobs that need more must ask for it explicitly.
permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stryker:
    name: stryker mutation score
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Stryker (runner installed on CI only)
        run: >-
          npx --yes
          -p @stryker-mutator/core
          -p @stryker-mutator/jest-runner
          stryker run stryker.conf.json