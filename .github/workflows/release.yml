name: Release NPM Package

# Publishes a tagged commit to npm with provenance. Tags only: the tag must
# equal `v<package.json version>`, and the commit must already have a fully
# successful CI run. A prerelease version (one containing "-") publishes under
# the `next` dist-tag and a prerelease GitHub release; a plain version goes to
# `latest`. Actions are pinned by commit SHA and npm by exact version.

on:
  push:
    tags:
      - 'v*'

# Restrictive default so any job added later starts read-only; the publish job
# elevates explicitly to what it needs (contents + id-token for the release and
# for npm provenance).
permissions:
  contents: read

jobs:
  release:
    name: publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      checks: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Pin npm
        run: npm install -g npm@11.19.1

      - name: Assert the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi
          if [[ "${version}" == *-* ]]; then
            echo "DIST_TAG=next" >> "$GITHUB_ENV"
            echo "PRERELEASE=true" >> "$GITHUB_ENV"
          else
            echo "DIST_TAG=latest" >> "$GITHUB_ENV"
            echo "PRERELEASE=false" >> "$GITHUB_ENV"
          fi

      - name: Wait for every required CI check of this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Every one of these must exist for this commit, be completed, and
          # have succeeded. Naming them is the point: comparing "succeeded" to
          # "registered so far" passes the instant the first fast job reports,
          # which publishes without the unit matrix, integration, conformance
          # or package smoke having run at all. test/static/release-gate.test.ts
          # pins this list against the jobs ci.yml actually defines.
          required=$(cat <<'REQUIRED'
          test (node 22 on ubuntu-latest)
          test (node 24 on ubuntu-latest)
          test (node 26 on ubuntu-latest)
          test (node 22 on windows-latest)
          test (node 24 on windows-latest)
          test (node 26 on windows-latest)
          test (node 22 on macos-latest)
          test (node 24 on macos-latest)
          test (node 26 on macos-latest)
          npm audit (high+)
          typecheck (full program: src + test + configs)
          integration (DynamoDB Local)
          conformance (langgraph 1.1.5)
          conformance (langgraph latest)
          repository hygiene (knip, depcheck, jscpd, actionlint, changelog)
          peer dependency floors
          API reference is regenerated
          package smoke (npm pack + install + import)
          REQUIRED
          )
          for _ in $(seq 1 60); do
            runs="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.app.slug == "github-actions")]')"
            # Any failure of any of this commit's checks stops the release, not
            # only a failure among the required ones.
            failed="$(echo "$runs" | jq -r '[.[] | select(.status == "completed" and .conclusion != "success" and .conclusion != "skipped") | .name] | join(", ")')"
            if [ -n "$failed" ]; then
              echo "CI failed for this commit (${failed}); not publishing" >&2
              exit 1
            fi
            missing=""
            while IFS= read -r name; do
              ok="$(echo "$runs" | jq --arg n "$name" '[.[] | select(.name == $n and .status == "completed" and .conclusion == "success")] | length')"
              if [ "$ok" = "0" ]; then missing="${missing}${name}; "; fi
            done <<< "$required"
            if [ -z "$missing" ]; then
              echo "every required check succeeded for ${GITHUB_SHA}"
              exit 0
            fi
            echo "still waiting on: ${missing}"
            sleep 30
          done
          echo "required checks did not all succeed within 30 minutes: ${missing}" >&2
          exit 1

      - name: Install dependencies
        run: npm ci

      - name: Gates
        run: |
          npm run typecheck
          npm run lint
          npm run build
          npm test -- --ci

      - name: Package smoke
        run: npm run test:package-smoke

      - name: Publish to npm
        run: npm publish --access public --provenance --tag "${DIST_TAG}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          generate_release_notes: true
          prerelease: ${{ env.PRERELEASE == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
