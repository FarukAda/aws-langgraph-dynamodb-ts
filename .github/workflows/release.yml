name: Release NPM Package

# Tags only. A release starts from a pushed `v*` tag and nothing else: there is
# no manual dispatch, so no run can publish whatever a branch's HEAD happens to
# be.
on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Nothing is granted at the top, so a job added later without its own
# `permissions:` block inherits none rather than the repository default.
#
# The split below is the point of this file's shape. Publishing to npm through
# Trusted Publishing means a job can mint a registry credential out of thin air
# from `ACTIONS_ID_TOKEN_REQUEST_URL` and `ACTIONS_ID_TOKEN_REQUEST_TOKEN`, both
# of which are plain environment variables visible to every process in that job.
# `verify` runs `npm ci` over some six hundred development packages and then
# executes them: eslint, jest, tsc, the packaging checks. Any one of those, at
# install time or at run time, could read those two variables and publish
# anything it liked as this package, *with a valid provenance attestation
# attached*, which is worse than a leaked token because it looks authentic.
#
# So `verify` has no `id-token` and cannot mint anything, and `publish` runs no
# third-party code at all: it downloads the tarball `verify` already built and
# checked, signs it with GitHub's own attestation action, and runs `npm publish`
# on it with npm's own bundled binary, using only actions GitHub owns. The
# GitHub release is created afterwards by `github-release`, with the `gh` the
# runner ships, and that job has no `id-token` either. npm's Trusted Publishing
# validates the repository and the *workflow file*, not the job, so splitting
# the work into jobs inside this same file needs no change on the registry
# side. test/static/release-gate.test.ts pins that shape.
permissions: {}

jobs:
  verify:
    name: verify ${{ github.ref_name }}
    runs-on: ubuntu-latest
    # The CI gate below waits up to 45 minutes; the rest of the job takes
    # about ten.
    timeout-minutes: 60
    permissions:
      contents: read
      # Lets the CI gate below read this commit's check runs.
      checks: read
    outputs:
      dist-tag: ${{ steps.version.outputs.dist-tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      version: ${{ steps.version.outputs.version }}
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      # Full history, for the ancestry check below. No persisted token: nothing
      # in this job pushes, and `npm ci` runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The tag must be exactly `v<package.json version>`: a tag pushed against
      # a commit whose package.json was never bumped would otherwise either
      # publish a duplicate version (and fail late, after every gate ran) or,
      # worse, publish the wrong version number under a tag that claims
      # another. The ref-type check is a second lock on the tags-only trigger.
      #
      # A prerelease version (one containing `-`, e.g. 1.0.0-rc.2) publishes
      # under the `next` dist-tag and as a prerelease GitHub release, so
      # `npm install` without a tag keeps resolving to the last stable
      # version. A plain version goes to `latest`.
      - name: Verify tag matches package.json version
        id: version
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "::error::Release must run from a tag ref (got ${GITHUB_REF_TYPE} ${GITHUB_REF})."
            exit 1
          fi
          TAG="${GITHUB_REF_NAME}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "version=${PKG_VERSION}" >> "$GITHUB_OUTPUT"
          if [ "${TAG}" != "v${PKG_VERSION}" ]; then
            echo "::error::Tag ${TAG} does not match package.json version ${PKG_VERSION} (expected v${PKG_VERSION})."
            exit 1
          fi
          if [[ "${PKG_VERSION}" == *-* ]]; then
            echo "dist-tag=next" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "Releasing ${TAG} (package.json version ${PKG_VERSION}) as a prerelease under the next dist-tag."
          else
            echo "dist-tag=latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "Releasing ${TAG} (package.json version ${PKG_VERSION}) under the latest dist-tag."
          fi

      # A release is cut only from a commit `main` already holds. The CI gate
      # below reads the check runs of the tagged commit, and a pull request's
      # head commit carries those too, so without this a tag pushed onto an
      # unmerged branch could publish code that was never reviewed into main.
      - name: Refuse a tag whose commit is not on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" FETCH_HEAD; then
            echo "::error::${GITHUB_SHA} is not on main; a release is cut only from a commit main already holds."
            exit 1
          fi

      # Publishing is gated on the CI that already ran for this commit, and on
      # the live-AWS tier that runs on this same tag push. The gates re-run
      # below catch a broken toolchain on this runner, but only the matrix
      # proves the other operating systems and Node versions, only
      # integration-live.yml proves the package against the real services, and
      # only the commit's own check runs carry that.
      #
      # The required names are listed rather than counted. Counting ("some
      # checks ran and none failed") passes when `ci.yml` produced no check
      # runs at all on this commit, which a rename, invalid YAML or a
      # later-added `paths-ignore:` would cause: CodeQL and Scorecard alone
      # would then be a complete, green set. Every name must be present *and*
      # successful; `live-aws integration` is one of them, so a tag whose live
      # run failed, or never ran, does not publish.
      #
      # `id` is asked for because a commit can carry several runs of one check
      # (a re-run, or a second tag at the same commit) and only the newest of
      # them counts. Without the id the script cannot tell which that is, and
      # treats the name as failed. The names are in scripts/required-checks.json
      # and what each exit code means is in scripts/require-green-ci.mjs. It is
      # a script rather than shell here so that its classification is
      # unit-testable off a runner: a release gate that has never been
      # exercised is not a gate.
      #
      # It runs from the checkout with the runner's own Node, before `npm ci`:
      # the script imports nothing outside the repository. It waits up to 45
      # minutes because the live tier starts on the same push as this job and
      # runs its suites one at a time; a failure ends the wait at once.
      - name: Wait for a fully successful CI run of this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 90); do
            status=0
            CHECK_RUNS="$(gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100" \
              --jq '.check_runs[] | {id, name, status, conclusion}')" \
              npm run --silent ci:require-green || status=$?
            case "${status}" in
              0) exit 0 ;;
              2) sleep 30 ;;
              *) exit "${status}" ;;
            esac
          done
          echo "::error::Required CI checks for ${GITHUB_SHA} did not all succeed within 45 minutes; not publishing."
          exit 1

      # Node 24 for the whole release. Trusted Publishing requires npm >= 11.5.1
      # and every Node 22.x release still bundles npm 10.x; Node 24.x bundles
      # 11.x, which clears that floor on its own. Nothing installs npm from the
      # registry here on purpose: the CLI that holds the OIDC token in the
      # `publish` job is the one Node shipped with, not one fetched at release
      # time. The package itself supports Node >=22 (see engines.node); the 24
      # here is a publisher-side choice only.
      #
      # No dependency cache: the release installs from the lockfile alone, not
      # from a cache another workflow run may have written.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run typecheck:all
      - run: npm test -- --ci
      - run: npm run build
      # The same consumer-side checks CI runs: the tarball's shape (listing,
      # publint, arethetypeswrong), then pack, install into a fresh project
      # and use the public API from ESM, CommonJS and TypeScript. The smoke
      # rebuilds dist internally.
      - run: npm run pack:check
      - run: npm run test:package-smoke
      # CI audited the commit; an advisory can land between that run and this
      # tag, and this is the last moment before anything is irreversible.
      - run: npm audit --audit-level=high

      # Pack once, here, and publish exactly this file. Anything that repacks
      # in the publish job would be publishing an artifact nothing checked.
      - name: Pack the tarball that will be published
        id: pack
        run: |
          set -euo pipefail
          TARBALL="$(npm pack --json | node -p "JSON.parse(require('node:fs').readFileSync(0,'utf8'))[0].filename")"
          echo "tarball=${TARBALL}" >> "$GITHUB_OUTPUT"
          echo "Packed ${TARBALL}"
          npm pack --dry-run

      # Two SBOMs, because `npm sbom` alone cannot describe what a consumer of
      # this package installs: see the script's header.
      - run: npm run sbom

      # The release body is this version's CHANGELOG section, not a generated
      # list of commit subjects. A reader following a release link wants the
      # breaking changes and the upgrade notes, and those are written there.
      #
      # Built here, in `verify`, because it can fail on what is in the
      # repository: the script exits 1 for a version with no section (a tag cut
      # with the heading still `[Unreleased]`), and GitHub refuses a body over
      # 125,000 characters. Built after `npm publish`, either failure would
      # leave the version live on npm with no GitHub release and no SBOMs
      # attached, and a re-run unable to get past a publish that had already
      # happened. Everything that can fail on repository content has to fail
      # before the one step that cannot be taken back.
      - name: Build the release body from the CHANGELOG
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          npm run --silent changelog-section -- "${VERSION}" > release-body.md
          CHARS="$(wc -m < release-body.md)"
          echo "release body: ${CHARS} characters"
          if [ "${CHARS}" -lt 1 ] || [ "${CHARS}" -gt 125000 ]; then
            echo "::error::The CHANGELOG section for ${VERSION} is ${CHARS} characters; a GitHub release body must be 1 to 125000."
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: |
            ${{ steps.pack.outputs.tarball }}
            sbom.build.cyclonedx.json
            sbom.runtime.cyclonedx.json
            release-body.md
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish ${{ github.ref_name }}
    needs: verify
    runs-on: ubuntu-latest
    # A deployment environment is the one control that puts a human between
    # `git push --tags` and a live `latest`: the job waits for a required
    # reviewer before it can mint an OIDC token. The token then carries an
    # `environment` claim, and npm's trusted publisher for this package names
    # the same environment, so the two sides must change together.
    environment: npm-publish
    timeout-minutes: 15
    permissions:
      # Required for npm Trusted Publishing and automatic provenance. The
      # GitHub release is created by the next job, so the token that creates it
      # never sits where a registry credential can be minted. What runs here is
      # npm's own bundled binary and actions owned by GitHub, pinned by commit.
      id-token: write
      # Lets the attestation step below store its provenance with the
      # repository, where `gh attestation verify` finds it.
      attestations: write
    steps:
      # No checkout: publishing a tarball needs nothing from the repository,
      # and nothing here runs `npm ci`, so no third-party package executes in
      # the job that can mint a registry credential.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts

      - name: Confirm npm is new enough for Trusted Publishing
        run: |
          set -euo pipefail
          npm --version
          node -e 'const [maj,min,pat]=require("node:child_process").execSync("npm --version").toString().trim().split(".").map(Number); const ok = maj>11 || (maj===11 && (min>5 || (min===5 && pat>=1))); if(!ok){ console.error("::error::npm is older than 11.5.1; Trusted Publishing will fall back to token auth."); process.exit(1); }'

      # Show exactly what is about to be published (the file list and the
      # resolved version) in the run log, before anything is irreversible.
      #
      # `--ignore-scripts` on both: npm runs no lifecycle script when it is
      # handed a tarball rather than a folder, and the flag makes that a
      # statement here rather than an assumption about npm.
      - name: Publish (dry run)
        env:
          TARBALL: ${{ needs.verify.outputs.tarball }}
          DIST_TAG: ${{ needs.verify.outputs.dist-tag }}
        run: npm publish "./${TARBALL}" --dry-run --ignore-scripts --access public --tag "${DIST_TAG}"

      # SLSA build provenance for the three files this release ships: the
      # tarball npm is about to receive and the two SBOMs attached to the
      # GitHub release. npm's own provenance covers only the tarball and lives
      # on the registry; this one also covers the SBOMs, and is attached to the
      # release as `provenance.intoto.jsonl`, the file the OpenSSF Scorecard
      # Signed-Releases check looks for next to a release's assets.
      #
      # It runs *before* the publish on purpose. Signing talks to Sigstore and
      # to the attestations API, either of which can be down; failing here
      # leaves nothing published and the tag can simply be re-run, where
      # failing after `npm publish` would leave a live version with no GitHub
      # release. The action is GitHub's own, pinned, and installs nothing from
      # the registry, so the rule above about third-party code in this job
      # still holds.
      #
      # Verify any of the three with
      #   gh attestation verify <file> --repo FarukAda/aws-langgraph-dynamodb-ts
      # or offline against the attached bundle with `--bundle provenance.intoto.jsonl`.
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ needs.verify.outputs.tarball }}
            sbom.runtime.cyclonedx.json
            sbom.build.cyclonedx.json

      # The action writes one Sigstore bundle per line (a DSSE-signed in-toto
      # statement), which is exactly what the `.intoto.jsonl` name promises.
      - name: Name the provenance bundle for the release
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "${BUNDLE}" provenance.intoto.jsonl

      # Handed to `github-release`, which attaches it. Uploaded before the
      # publish, like everything else that can fail here.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provenance
          path: provenance.intoto.jsonl
          if-no-files-found: error
          retention-days: 7

      # Do NOT set NODE_AUTH_TOKEN here: setting it (even as empty) causes npm
      # to try token auth and bypass OIDC. The --provenance flag is explicit:
      # npm's docs say it is automatic with trusted publishing, but some npm
      # versions still require the flag, and it is harmless to include it.
      - name: Publish
        env:
          TARBALL: ${{ needs.verify.outputs.tarball }}
          DIST_TAG: ${{ needs.verify.outputs.dist-tag }}
        run: npm publish "./${TARBALL}" --ignore-scripts --access public --provenance --tag "${DIST_TAG}"

  github-release:
    name: github release ${{ github.ref_name }}
    needs: [verify, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # To create the release and attach its files. Nothing else: no
      # `id-token`, so this job cannot mint a registry credential.
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: provenance

      # `release-body.md` came down with the artifacts: `verify` built it from
      # the CHANGELOG and checked it, so nothing after the publish above can
      # fail on what the repository contains. `gh` is preinstalled on the
      # runner, so no action from outside GitHub runs with this token. A re-run
      # after a partial failure finds the release already there and updates it
      # instead of failing to create it twice.
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          FILES=(sbom.runtime.cyclonedx.json sbom.build.cyclonedx.json provenance.intoto.jsonl)
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" \
              --notes-file release-body.md --prerelease="${PRERELEASE}"
            gh release upload "${TAG}" --repo "${GITHUB_REPOSITORY}" --clobber "${FILES[@]}"
          else
            gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" --verify-tag \
              --title "${TAG}" --notes-file release-body.md --prerelease="${PRERELEASE}" \
              "${FILES[@]}"
          fi

      # Nothing here moves the `next` dist-tag after a stable release, so
      # `npm install pkg@next` keeps resolving to the last release candidate
      # indefinitely. It is not automated because npm documents the OIDC
      # exchange for publishing and says nothing about whether the credential it
      # mints also authenticates `npm dist-tag`; a step that fails *after* a
      # successful publish would leave the release half-done and the job red.
      # So it is a reminder in the run summary, where the person who tagged is
      # already looking.
      - name: Remind that the next dist-tag still points at the last prerelease
        if: needs.verify.outputs.prerelease != 'true'
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          {
            echo "### One manual step remains"
            echo
            echo "\`${VERSION}\` is now \`latest\`. The \`next\` dist-tag still points at the last"
            echo "prerelease, so \`npm install @farukada/aws-langgraph-dynamodb-ts@next\` resolves"
            echo "to it. Move it:"
            echo
            echo '```bash'
            echo "npm dist-tag add @farukada/aws-langgraph-dynamodb-ts@${VERSION} next"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
