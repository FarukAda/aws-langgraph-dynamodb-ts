name: Nightly real-AWS

# Runs the on-demand real-AWS suite against a live DynamoDB account nightly, so
# SDK/service behaviour drift surfaces before users hit it. Uses short-lived
# OIDC credentials (no static keys). Configure the role ARN as a repo variable
# AWS_TEST_ROLE_ARN and a region in AWS_TEST_REGION.

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

concurrency:
  group: nightly-aws
  cancel-in-progress: true

jobs:
  aws:
    name: real-AWS suite
    runs-on: ubuntu-latest
    # Skip cleanly on forks / when the role isn't configured.
    if: ${{ vars.AWS_TEST_ROLE_ARN != '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_TEST_ROLE_ARN }}
          aws-region: ${{ vars.AWS_TEST_REGION || 'eu-central-1' }}

      - name: Run real-AWS tests
        run: npm run test:aws
        env:
          AWS_REGION: ${{ vars.AWS_TEST_REGION || 'eu-central-1' }}