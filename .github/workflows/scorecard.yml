# OpenSSF Scorecard: an external, mechanical read of this repository's supply
# chain posture — branch protection, pinned dependencies, token permissions,
# signed releases, SAST and so on.
#
# `publish_results: true` is required for the README badge to resolve, and it
# means the score is published to the public OpenSSF API. That is the point of
# the badge, but it is worth stating plainly: this makes the result visible to
# anyone, including checks this repository currently fails.
#
# Actions are pinned by commit SHA rather than by tag, as release.yml already
# is — and Scorecard's own Pinned-Dependencies check grades exactly that.
name: Scorecard

on:
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    - cron: '0 5 * * 2'

concurrency:
  group: scorecard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Upload the SARIF result to the Security tab.
      security-events: write
      # Publish the result to the OpenSSF API, which is what the badge reads.
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
