name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22', '24']
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --ci

  audit:
    name: npm audit (high+)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fail the build only on high/critical advisories. Moderate/low are surfaced
      # by dependabot PRs and shouldn't block merges.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  typecheck-all:
    name: 'typecheck (full program: src + test + configs)'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check (full program)
        run: npm run typecheck:all

  integration:
    name: integration (DynamoDB Local)
    runs-on: ubuntu-latest
    services:
      dynamodb-local:
        image: amazon/dynamodb-local:latest
        ports:
          - 8000:8000
        # DDB Local's image has no healthcheck; the job waits below via a curl
        # poll before kicking off tests.
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Wait for DynamoDB Local
        run: |
          # DDB Local rejects unsigned requests with HTTP 400 — that is still
          # proof the service bound the port. Accept ANY HTTP response
          # (curl without `-f`, exit 0 on 4xx/5xx) as "up". Using -f here, as
          # we did previously, caused the poll to hang for all 30 attempts
          # because DDB Local never returns 2xx on a curl-unsigned request.
          for i in $(seq 1 60); do
            if curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/ \
                2>/dev/null | grep -qE '^[1-5][0-9][0-9]$'; then
              echo "DynamoDB Local is up."
              exit 0
            fi
            echo "Waiting for DynamoDB Local... ($i/60)"
            sleep 2
          done
          echo "DynamoDB Local never came up." >&2
          exit 1

      - name: Run integration tests
        run: npm run test:integration
        env:
          DDB_LOCAL_ENDPOINT: http://localhost:8000

      - name: Run conformance tests (LangGraph contract on real DynamoDB)
        run: npm run test:conformance
        env:
          DDB_LOCAL_ENDPOINT: http://localhost:8000

  conformance-matrix:
    name: conformance (langgraph ${{ matrix.langgraph }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Prove the WRITES_IDX_MAP / checkpoint contract holds across the
        # supported @langchain/langgraph-checkpoint range (Decision D3).
        langgraph: ['1.0.3', 'latest']
    services:
      dynamodb-local:
        image: amazon/dynamodb-local:latest
        ports:
          - 8000:8000
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pin the checkpoint package under test
        run: npm install --no-save @langchain/langgraph-checkpoint@${{ matrix.langgraph }}

      - name: Type-check the adapters against the pinned checkpoint package
        run: npm run typecheck:all

      - name: Wait for DynamoDB Local
        run: |
          for i in $(seq 1 60); do
            if curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/ \
                2>/dev/null | grep -qE '^[1-5][0-9][0-9]$'; then
              echo "DynamoDB Local is up."
              exit 0
            fi
            sleep 2
          done
          echo "DynamoDB Local never came up." >&2
          exit 1

      - name: Run conformance tests
        run: npm run test:conformance
        env:
          DDB_LOCAL_ENDPOINT: http://localhost:8000

  package-smoke:
    name: package smoke (npm pack + install + import)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Pack and smoke-test the tarball
        run: npm run test:package-smoke
