name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege for every job: nothing here writes to the repository, creates
# a release or requests an OIDC token, so the default token scope is wider than
# any job needs. Jobs that need more must ask for it explicitly.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Superseded pushes to a branch are cancelled; runs on main always finish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Every job bounds itself with `timeout-minutes`, so a hung step costs minutes
# rather than GitHub's six-hour default, and every checkout drops its token,
# since no job here pushes and `npm ci` runs in most of them.
# test/static/workflow-hygiene.test.ts pins both, in every workflow.
jobs:
  test:
    name: test (node ${{ matrix.node }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22', '24', '26']
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --ci

  audit:
    name: npm audit (high+)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # No --omit=dev. @langchain/core and @langchain/langgraph-checkpoint are
      # peers npm installs itself, which --omit=dev still audits, but the
      # optional peer @aws-sdk/client-s3 is installed here only because it is
      # also a devDependency, so --omit=dev dropped it and everything under it,
      # though a consumer who turns on S3 offload runs that code in production.
      - name: Audit dependencies (high+)
        run: npm audit --audit-level=high

  typecheck-all:
    name: 'typecheck (full program: src + test + configs)'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check (full program)
        run: npm run typecheck:all

  integration:
    name: integration (DynamoDB Local)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      dynamodb-local:
        image: amazon/dynamodb-local:3.3.1
        ports:
          - 8000:8000
        # DDB Local's image has no healthcheck; the job waits below via a curl
        # poll before kicking off tests.
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Wait for DynamoDB Local
        run: |
          # DDB Local rejects unsigned requests with HTTP 400 — that is still
          # proof the service bound the port. Accept ANY HTTP response
          # (curl without `-f`, exit 0 on 4xx/5xx) as "up". Using -f here, as
          # we did previously, caused the poll to hang for all 30 attempts
          # because DDB Local never returns 2xx on a curl-unsigned request.
          for attempt in $(seq 1 60); do
            if curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/ \
                2>/dev/null | grep -qE '^[1-5][0-9][0-9]$'; then
              echo "DynamoDB Local is up."
              exit 0
            fi
            echo "Waiting for DynamoDB Local... ($attempt/60)"
            sleep 2
          done
          echo "DynamoDB Local never came up." >&2
          exit 1

      - name: Run integration tests
        run: npm run test:integration -- --json --outputFile=jest-integration.json
        env:
          DDB_LOCAL_ENDPOINT: http://localhost:8000

      - name: Annotate failing integration tests
        if: failure()
        run: node .github/scripts/annotate-jest.mjs jest-integration.json integration

      - name: Run conformance tests (LangGraph contract on real DynamoDB)
        run: npm run test:conformance -- --json --outputFile=jest-conformance.json
        env:
          DDB_LOCAL_ENDPOINT: http://localhost:8000

      - name: Annotate failing conformance tests
        if: failure()
        run: node .github/scripts/annotate-jest.mjs jest-conformance.json conformance

  conformance-matrix:
    name: conformance (langgraph ${{ matrix.langgraph }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Prove the checkpoint contract holds across the supported
        # @langchain/langgraph-checkpoint range: the declared floor (the
        # peerDependencies range's lower bound) and the newest release.
        langgraph: ['1.1.5', 'latest']
    services:
      dynamodb-local:
        image: amazon/dynamodb-local:3.3.1
        ports:
          - 8000:8000
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pin the checkpoint package under test
        run: npm install --no-save @langchain/langgraph-checkpoint@${{ matrix.langgraph }}

      - name: Type-check the adapters against the pinned checkpoint package
        run: npm run typecheck:all

      - name: Wait for DynamoDB Local
        run: |
          for _ in $(seq 1 60); do
            if curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/ \
                2>/dev/null | grep -qE '^[1-5][0-9][0-9]$'; then
              echo "DynamoDB Local is up."
              exit 0
            fi
            sleep 2
          done
          echo "DynamoDB Local never came up." >&2
          exit 1

      - name: Run conformance tests
        run: npm run test:conformance -- --json --outputFile=jest-conformance-matrix.json
        env:
          DDB_LOCAL_ENDPOINT: http://localhost:8000

      - name: Annotate failing conformance tests
        if: failure()
        run: node .github/scripts/annotate-jest.mjs jest-conformance-matrix.json conformance

  hygiene:
    name: repository hygiene (knip, depcheck, jscpd, actionlint, changelog)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unused exports, dependencies and files (knip)
        run: npm run unused

      - name: Unused and missing dependencies (depcheck)
        run: npm run depcheck

      - name: Duplicated source (jscpd)
        run: npm run cpd

      # The maintenance sweep is an ESM .mjs script, so its tests run under
      # node --test rather than the jest tier. No build and no AWS: the whole
      # suite drives hand-rolled fake clients.
      - name: Maintenance script tests (node --test)
        run: npm run test:scripts

      # Every ts/typescript sample in README, CONTRIBUTING and CHANGELOG is
      # compiled against src/. A name in the docs is not a signature: a call
      # written the old way used to pass every other check.
      - name: Documentation samples type-check (check:docs)
        run: npm run check:docs

      # Every relative link and #anchor in the hand-written docs resolves.
      # Offline: external URLs are not fetched.
      - name: Documentation links and anchors resolve (check:links)
        run: npm run check:links

      - name: Workflow syntax (actionlint)
        run: docker run --rm -v "${PWD}:/repo" -w /repo rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color # v1.7.12

      - name: CHANGELOG entry for source changes (pull requests)
        if: github.event_name == 'pull_request'
        run: |
          base="origin/${{ github.base_ref }}"
          git fetch --no-tags origin "${{ github.base_ref }}"
          if git diff --name-only "$base"...HEAD | grep -q "^src/" && ! git diff --name-only "$base"...HEAD | grep -q "^CHANGELOG.md$"; then
            echo "src/ changed without a CHANGELOG entry under [Unreleased]" >&2
            exit 1
          fi

  peer-floors:
    name: peer dependency floors
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The floor of each range is computed by scripts/peer-floors.mjs, which
      # refuses a range it cannot reduce to one version rather than degrading
      # to "install whatever npm resolves" for a >=, an x-range or a ||
      # union. One spec per line, read with mapfile, so no spec can be split
      # on a space. Each floor is then checked on its own, name and version:
      # `npm ls` given several specs lists whichever match and exits 0 if any
      # does, and given bare names it never looks at the version at all.
      - name: Install every declared peer at its floor
        run: |
          set -euo pipefail
          mapfile -t floors < <(npm run --silent peer-floors)
          echo "installing ${floors[*]}"
          npm install --no-save "${floors[@]}"
          for floor in "${floors[@]}"; do
            npm ls --depth=0 "$floor"
          done

      - name: Type-check and unit-test against the floors
        run: |
          set -euo pipefail
          npm run typecheck:all
          npm test -- --ci

  docs:
    name: API reference is regenerated
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate docs/api and fail on drift
        run: |
          npm run docs
          if ! git diff --quiet -- docs/api; then
            stat="$(git diff --stat -- docs/api | tail -n 20 | tr '\n' ' ')"
            sample="$(git diff -- docs/api | head -n 40 | tr '\n' ' ' | tr -d '\r')"
            echo "::error title=docs/api is stale::${stat} ${sample}"
            echo "docs/api is stale: run npm run docs and commit the result" >&2
            exit 1
          fi

  package-smoke:
    name: package smoke (npm pack + install + import)
    runs-on: ubuntu-latest
    # The steps below bound themselves: test:surface through
    # scripts/run-with-timeout.mjs, each package-smoke test at 10 minutes and
    # the consumer-types test at 15, all of them installing from the network.
    # This bounds the whole job against everything else that could stall —
    # npm ci, the build, pack:check — and sits above a single test's own bound,
    # so a test that hangs on a slow registry fails with its own timeout and
    # diagnostics instead of the job being cut off around it.
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Surface baseline (what the public API accepts and rejects)
        run: npm run test:surface

      - name: Verify the package listing, exports and types (pack:check)
        run: npm run pack:check

      - name: Pack and smoke-test the tarball
        run: npm run test:package-smoke

      - name: Type-check a consumer pinned to an older AWS SDK
        run: npm run test:consumer-types
