# Static analysis of the package's own source.
#
# The repository had no SAST: `npm audit` covers known advisories in
# dependencies, and the static guards under test/static enforce house rules,
# but nothing looked for injection, unsafe deserialization or tainted-path
# patterns in the code this package ships.
#
# Actions are pinned by commit SHA rather than by tag, as release.yml already
# is: a tag can be moved, and a security workflow is the last place to trust a
# mutable reference.
name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly, so a newly published query finds existing code without waiting
    # for the next change to main.
    - cron: '0 4 * * 2'

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Needed to upload the SARIF results to the Security tab.
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: javascript-typescript
          # security-extended adds the lower-severity queries; this package
          # handles caller-supplied identifiers that become storage keys, so the
          # extra taint-tracking is worth the runtime.
          queries: security-extended

      # No build step: CodeQL analyses TypeScript sources directly for the
      # javascript-typescript language, so `npm ci && npm run build` would cost
      # minutes and tell it nothing it does not already see.

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: /language:javascript-typescript
