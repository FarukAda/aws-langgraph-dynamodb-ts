# Static analysis of the package's own source and of its workflows.
#
# The repository had no SAST: `npm audit` covers known advisories in
# dependencies, and the static guards under test/static enforce house rules,
# but nothing looked for injection, unsafe deserialization or tainted-path
# patterns in the code this package ships.
#
# Two languages, because they catch different things and only one of them is
# TypeScript. `actions` analyses the workflow files themselves — excessive
# GITHUB_TOKEN scope, untrusted input reaching a `run:` block, an action
# pinned to a movable tag. Dropping it would leave CI unexamined by the very
# workflow whose job is to examine the repository.
#
# Actions are pinned by commit SHA rather than by tag, as release.yml already
# is: a tag can be moved, and a security workflow is the last place to trust a
# mutable reference.
name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly, so a newly published query finds existing code without waiting
    # for the next change to main.
    - cron: '0 4 * * 2'

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # One language's failure must not cancel the other's analysis; a partial
      # upload is still a result.
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    permissions:
      # Needed to upload the SARIF results to the Security tab.
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          # security-extended adds the lower-severity queries; this package
          # handles caller-supplied identifiers that become storage keys, so the
          # extra taint-tracking is worth the runtime.
          queries: security-extended

      # No build step for either language: CodeQL analyses TypeScript sources
      # directly, and workflow files are already the artifact, so
      # `npm ci && npm run build` would cost minutes and tell it nothing it does
      # not already see.

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
