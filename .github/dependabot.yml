version: 2

updates:
  - package-ecosystem: npm
    directory: /
    # Raise the range in package.json with every update, so the ranges always
    # name the releases this repository tests against and `npm-check-updates`
    # has nothing to report. Dependabot never touches peerDependencies: a peer
    # floor is raised by hand, in a major, and announced in that release's
    # CHANGELOG (README, *Supported runtimes and peers*).
    versioning-strategy: increase
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    # A release gets a week before an update proposes it, so one pulled or
    # compromised within days of publication never reaches a pull request.
    # Security updates are not delayed: cooldown applies to version updates only.
    cooldown:
      default-days: 7
    groups:
      aws-sdk:
        patterns:
          - "@aws-sdk/*"
      langchain:
        patterns:
          - "@langchain/*"
      dev-dependencies:
        dependency-type: development
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # The same week's grace as the npm updates above.
    cooldown:
      default-days: 7
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action"
          - "github/codeql-action/*"
    commit-message:
      prefix: "ci"
