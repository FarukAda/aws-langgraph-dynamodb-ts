version: 2

updates:
  - package-ecosystem: npm
    directory: /
    # Raise a range in package.json only when the new version falls outside it.
    # This package is a library: a dependency or peer floor moves in a release
    # the CHANGELOG announces, never in a routine update (README, *Supported
    # runtimes and peers*).
    versioning-strategy: increase-if-necessary
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    # A release gets a week before an update proposes it, so one pulled or
    # compromised within days of publication never reaches a pull request.
    # Security updates are not delayed: cooldown applies to version updates only.
    cooldown:
      default-days: 7
    ignore:
      # Dev-only (examples/live-agent.mjs). langchain 1.5.12 and later raise
      # their @langchain/core peer above this package's declared floor, so the
      # `peer dependency floors` CI job cannot install the floor next to them.
      # Lift this when the @langchain/core floor moves in a release.
      - dependency-name: langchain
        versions: [">=1.5.12"]
    groups:
      aws-sdk:
        patterns:
          - "@aws-sdk/*"
      langchain:
        patterns:
          - "@langchain/*"
      dev-dependencies:
        dependency-type: development
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # The same week's grace as the npm updates above.
    cooldown:
      default-days: 7
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action"
          - "github/codeql-action/*"
    commit-message:
      prefix: "ci"
