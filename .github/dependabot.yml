version: 2

updates:
  - package-ecosystem: npm
    directory: /
    # Raise a range in package.json only when the new version falls outside it.
    # This package is a library: a dependency or peer floor moves in a release
    # the CHANGELOG announces, never in a routine update (README, *Supported
    # runtimes and peers*).
    versioning-strategy: increase-if-necessary
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      aws-sdk:
        patterns:
          - "@aws-sdk/*"
      langchain:
        patterns:
          - "@langchain/*"
      dev-dependencies:
        dependency-type: development
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action"
          - "github/codeql-action/*"
    commit-message:
      prefix: "ci"
