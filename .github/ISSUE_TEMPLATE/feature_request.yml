name: Feature request
description: A capability the adapters should have
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do and what stops you today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: How the API or the storage layout would change, and how it fits docs/STABILITY.md.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
